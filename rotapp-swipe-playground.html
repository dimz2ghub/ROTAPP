<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotapp swipe playground</title>
<style>
:root{--bg:#f4f3ef;--surface:#fff;--surface2:#f1efe8;--text:#1f1f1d;--text2:#5f5e5a;--muted:#8a8984;--border:#d9d7cf;--accent:#185FA5;--accentbg:#E6F1FB;--off:#E4E4E0;--offt:#5F5E5A}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--surface:#262624;--surface2:#30302e;--text:#f0efe9;--text2:#b4b2a9;--muted:#888780;--border:#444441;--accent:#85B7EB;--accentbg:#0C447C;--off:#3a3a37;--offt:#b4b2a9}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;max-width:480px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;position:relative;overflow:hidden}
#scr{flex:1;min-height:0;overflow:auto;padding:16px 16px 24px;padding-top:max(16px,env(safe-area-inset-top));touch-action:pan-y;user-select:none;-webkit-user-select:none}
nav{display:flex;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:0;background:none;color:var(--muted);padding:8px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.on{color:var(--accent);font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hd{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.side{display:flex;align-items:center;width:64px;flex:none}
.side.r{justify-content:flex-end}
.arr{border:0;background:none;color:var(--text2);font-size:26px;line-height:1;padding:4px 10px}
.refresh{border:0;background:none;color:var(--text2);width:30px;height:34px;font-size:20px;line-height:1;padding:0}
.reel{position:relative;flex:1;height:26px;overflow:hidden}
.rt{position:absolute;left:0;right:0;top:0;height:26px;line-height:26px;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;will-change:transform}
.mid{display:flex;justify-content:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--text);padding:7px 12px;font-size:13px}
.seg button.on{background:var(--accentbg);color:var(--accent);font-weight:600}
.g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{margin-bottom:3px}
.wd div{font-size:11px;color:var(--muted);text-align:center}
.swv{overflow:hidden;position:relative}
.trk{display:flex;width:calc(300% + 32px);gap:16px;align-items:flex-start;will-change:transform}
.pg{width:calc((100% - 32px) / 3);flex:none;min-width:0}
.c{height:52px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.25}
.c b{font-weight:600;font-size:11px}
.c.e{background:var(--surface2);color:var(--text2)}
.c.blank{background:transparent}
.tod{outline:2px solid var(--accent);outline-offset:-2px}
.sum{text-align:center;color:var(--text2);font-size:13px;margin-top:14px}
.card{border-radius:10px;padding:11px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.card .n{font-size:12px;line-height:1.25}
.card .n b{display:block;font-size:15px;font-weight:600}
.card .l{font-size:18px;font-weight:600}
.card.e{background:var(--surface2);color:var(--muted)}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--border);max-height:88%;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:16px}
.k{font-size:12px;color:var(--text2)}
.row{padding:12px 0;border-top:1px solid var(--border)}
.row>span{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.row .seg{display:flex}
.row .seg button{flex:1;padding:8px 6px}
input[type=range]{width:100%}
.read{background:var(--surface2);border-radius:8px;padding:10px;font-size:13px;margin-top:6px}
.done{display:block;width:100%;margin-top:12px;border:1px solid var(--accent);background:var(--accentbg);color:var(--accent);font-weight:600;border-radius:10px;padding:11px}
.hint{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--surface);border-radius:8px;padding:9px 14px;font-size:13px;z-index:4;width:max-content;max-width:90%;text-align:center;transition:opacity .4s}
</style>
</head>
<body>
<div id="app">
  <div id="scr"></div>
  <nav id="nav"></nav>
  <div id="ov"></div>
  <div class="hint" id="hint">Swipe the days. Tap Tune to change how it feels.</div>
</div>
<script>
const T={M:{sm:'M',bg:'#00B050',fg:'#000'},L:{sm:'L',bg:'#4472C4',fg:'#fff'},O:{sm:'Off',bg:'var(--off)',fg:'var(--offt)'},H:{sm:'H',bg:'#FFE24D',fg:'#000'}};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const EASE={standard:['cubic-bezier(.2,.8,.2,1)','Standard'],soft:['cubic-bezier(.22,1,.36,1)','Soft'],xsoft:['cubic-bezier(.16,1,.3,1)','Extra soft']};
const TODAY=new Date(2026,9,24);
const S={view:'month',off:{month:0,week:0},busy:false,tune:false};
const C={dur:450,ease:'soft',frame:'fixed'};

const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const PAT=['M','M','L','L','O','O','M','L','L','O'];
function code(d){
  if(d<new Date(2026,7,1)||d>new Date(2027,0,31))return null;
  if(d.getFullYear()===2026&&d.getMonth()===10&&d.getDate()>=2&&d.getDate()<=6)return 'H';
  const i=Math.round((d-new Date(2026,0,1))/864e5);return PAT[((i%10)+10)%10];
}
const monthDate=(o)=>new Date(2026,9+o,1);
const weekStart=(o)=>new Date(2026,9,19+7*o);
function title(v,o){
  if(v==='month'){const d=monthDate(o);return MF[d.getMonth()]+' '+d.getFullYear();}
  const a=weekStart(o),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);
  return a.getMonth()===b.getMonth()?a.getDate()+' – '+b.getDate()+' '+MN[b.getMonth()]:a.getDate()+' '+MN[a.getMonth()]+' – '+b.getDate()+' '+MN[b.getMonth()];
}
function monthPage(o){
  const f=monthDate(o),y=f.getFullYear(),m=f.getMonth(),dim=new Date(y,m+1,0).getDate(),st=(f.getDay()+6)%7;
  const total=C.frame==='fixed'?42:Math.ceil((st+dim)/7)*7;
  let h='<div class="g">';
  for(let i=0;i<total;i++){
    const n=i-st+1;
    if(n<1||n>dim){h+='<div class="c blank"></div>';continue;}
    const d=new Date(y,m,n),c=code(d),t=c&&T[c],tod=same(d,TODAY)?' tod':'';
    h+=t?'<div class="c'+tod+'" style="background:'+t.bg+';color:'+t.fg+'"><span>'+n+'</span><b>'+t.sm+'</b></div>':'<div class="c e'+tod+'"><span>'+n+'</span></div>';
  }
  return h+'</div>';
}
function weekPage(o){
  const s=weekStart(o);let h='';
  for(let i=0;i<7;i++){
    const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i),c=code(d),t=c&&T[c],tod=same(d,TODAY)?' tod':'';
    const nm='<div class="n"><b>'+DN[d.getDay()]+'</b>'+d.getDate()+' '+MN[d.getMonth()]+'</div>';
    h+=t?'<div class="card'+tod+'" style="background:'+t.bg+';color:'+t.fg+'">'+nm+'<div class="l">'+(c==='O'?'Off':c==='H'?'Holiday':c)+'</div></div>':'<div class="card e'+tod+'">'+nm+'<div class="l">–</div></div>';
  }
  return h;
}
const page=(v,o)=>v==='month'?monthPage(o):weekPage(o);
function summary(o){
  const f=monthDate(o),dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();let m=0,l=0;
  for(let n=1;n<=dim;n++){const c=code(new Date(f.getFullYear(),f.getMonth(),n));if(c==='M')m++;if(c==='L')l++;}
  return m+l?(m+l)+' shifts · '+m+' M · '+l+' L':'No shifts yet';
}

// ---------- render ----------
const scr=document.getElementById('scr');
let el={};
function render(){
  const v=S.view,o=S.off[v];
  let h='<div class="hd"><span class="side"><button class="arr" data-a="prev" aria-label="Previous">‹</button><button class="refresh" data-a="today" aria-label="Jump to today" style="visibility:'+(Math.abs(o)>1?'visible':'hidden')+'">↺</button></span>';
  h+='<div class="reel">'+[-1,0,1].map(s=>'<span class="rt" data-s="'+s+'">'+title(v,o+s)+'</span>').join('')+'</div>';
  h+='<span class="side r"><button class="arr" data-a="next" aria-label="Next">›</button></span></div>';
  if(v==='week')h+='<div class="mid"><span class="seg"><button class="on">Mon – Sun</button><button>Next 7 days</button></span></div>';
  else h+='<div class="g wd">'+['M','T','W','T','F','S','S'].map(x=>'<div>'+x+'</div>').join('')+'</div>';
  h+='<div class="swv"><div class="trk">'+[o-1,o,o+1].map(x=>'<div class="pg">'+page(v,x)+'</div>').join('')+'</div></div>';
  if(v==='month')h+='<div class="sum">'+summary(o)+'</div>';
  scr.innerHTML=h;
  el={swv:scr.querySelector('.swv'),trk:scr.querySelector('.trk'),pgs:[...scr.querySelectorAll('.pg')],rts:[...scr.querySelectorAll('.rt')]};
  transitions(false);layout(0);
  S.busy=false;
  drawNav();
}
// p: -1 = fully on previous, 0 = current, 1 = fully on next
function layout(p){
  const W=el.swv.clientWidth+16;
  el.trk.style.transform='translate3d('+(-W-p*W)+'px,0,0)';
  const H=26;
  el.rts.forEach(r=>{const s=+r.dataset.s,d=s-p;r.style.transform='translate3d(0,'+(d*H)+'px,0)';r.style.opacity=Math.max(0,1-Math.abs(d)*0.85);});
  if(C.frame==='adapt'&&S.view==='month'){
    const hc=el.pgs[1].offsetHeight,ht=p>=0?el.pgs[2].offsetHeight:el.pgs[0].offsetHeight;
    el.swv.style.height=(hc+(ht-hc)*Math.min(1,Math.abs(p)))+'px';
  } else el.swv.style.height='';
}
function transitions(on){
  const t=on?C.dur+'ms '+EASE[C.ease][0]:'';
  el.trk.style.transition=on?'transform '+t:'none';
  el.rts.forEach(r=>{r.style.transition=on?'transform '+t+', opacity '+t:'none';});
  el.swv.style.transition=on?'height '+t:'none';
}
const reduce=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let pending=null;
function run(p,dir,done){
  S.busy=true;
  if(reduce()){layout(p);if(done)done();else S.busy=false;return;}
  void el.trk.offsetWidth; // make sure the start position is applied before animating
  transitions(true);layout(p);
  const job={dir,done,fin:false,timer:0};
  const end=(e)=>{
    if(job.fin||(e&&(e.target!==el.trk||e.propertyName!=='transform')))return;
    job.fin=true;clearTimeout(job.timer);el.trk.removeEventListener('transitionend',end);pending=null;
    if(done)done();else{transitions(false);S.busy=false;}
  };
  job.end=end;
  el.trk.addEventListener('transitionend',end);
  job.timer=setTimeout(()=>end(),C.dur+120);
  pending=job;
}
function animateTo(dir,target){
  if(dir===0){run(0,0,null);return;}
  const v=S.view,o=S.off[v];
  if(target==null)target=o+dir;
  if(target!==o+dir){
    const idx=dir>0?2:0;
    el.pgs[idx].innerHTML=page(v,target);
    el.rts[idx].textContent=title(v,target);
  }
  run(dir,dir,()=>{S.off[v]=target;render();});
}
// Catch a page mid-animation: finish it straight away and return where it visually is,
// so a new swipe carries on from that spot instead of being ignored.
function interrupt(){
  if(!S.busy||!pending)return 0;
  const job=pending;pending=null;job.fin=true;clearTimeout(job.timer);el.trk.removeEventListener('transitionend',job.end);
  const W=el.swv.clientWidth+16;
  const tx=new DOMMatrixReadOnly(getComputedStyle(el.trk).transform).m41;
  let p=(-W-tx)/W;
  if(job.dir){job.done();p-=job.dir;}  // the new month is now the current one
  else{S.busy=false;}
  transitions(false);layout(p);
  return p;
}

// ---------- swipe ----------
let D=null,swallow=false;
scr.addEventListener('pointerdown',e=>{
  if(S.tune||!e.isPrimary||!el.swv)return;
  if(e.target.closest('button'))return;  // buttons handle their own taps
  const p0=interrupt();
  D={id:e.pointerId,x0:e.clientX,y0:e.clientY,lock:null,dx:0,p0,p:p0,W:el.swv.clientWidth+16,s:[{x:e.clientX,t:e.timeStamp}]};
});
scr.addEventListener('pointermove',e=>{
  if(!D||e.pointerId!==D.id)return;
  const dx=e.clientX-D.x0,dy=e.clientY-D.y0;
  if(D.lock===null){
    if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
    if(Math.abs(dx)>Math.abs(dy)*1.2){D.lock='x';transitions(false);try{scr.setPointerCapture(e.pointerId);}catch(err){}}
    else{const d=D;D=null;if(d.p0)animateTo(0);return;}
  }
  D.dx=dx;D.s.push({x:e.clientX,t:e.timeStamp});if(D.s.length>8)D.s.shift();
  D.p=Math.max(-1,Math.min(1,D.p0-dx/D.W));layout(D.p);
});
function endDrag(e,cancel){
  if(!D||e.pointerId!==D.id)return;
  const d=D;D=null;
  if(d.lock!=='x'){if(d.p0)animateTo(0);return;}
  swallow=true;setTimeout(()=>{swallow=false;},300);
  // speed over the last ~100 ms, so a quick flick counts even after a slow start
  const last=d.s[d.s.length-1];let first=d.s[0];
  for(const q of d.s){if(last.t-q.t<=100){first=q;break;}}
  const v=(last.x-first.x)/Math.max(1,last.t-first.t);
  let dir=0;
  if(!cancel){
    if(Math.abs(v)>0.3&&Math.abs(d.dx)>16)dir=v<0?1:-1;
    else if(Math.abs(d.p)>1/3)dir=d.p>0?1:-1;
  }
  animateTo(dir);
}
scr.addEventListener('pointerup',e=>endDrag(e,false));
scr.addEventListener('pointercancel',e=>endDrag(e,true));

// ---------- nav and tune ----------
const ICON={week:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 15h10"/>',month:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',tune:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
function drawNav(){
  document.getElementById('nav').innerHTML=[['week','Week'],['month','Month'],['tune','Tune']].map(x=>{
    const on=x[0]==='tune'?S.tune:S.view===x[0]&&!S.tune;
    return '<button class="tab'+(on?' on':'')+'" data-a="tab" data-v="'+x[0]+'"><svg viewBox="0 0 24 24">'+ICON[x[0]]+'</svg>'+x[1]+'</button>';
  }).join('');
}
function drawTune(){
  const ov=document.getElementById('ov');
  if(!S.tune){ov.innerHTML='';return;}
  const seg=(k,opts)=>'<span class="seg">'+opts.map(o=>'<button data-a="set" data-k="'+k+'" data-v="'+o[0]+'" class="'+(C[k]===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</span>';
  ov.innerHTML='<div class="dim" data-a="close"></div><div class="sheet"><h3>Swipe playground</h3><div class="k">Change a setting, close this, and swipe to feel it. When it feels right, tell me the values in the grey box.</div>'
    +'<div class="row"><span>Frame</span>'+seg('frame',[['fixed','Fixed 6 rows'],['adapt','Adapts to month']])+'<div class="k" style="margin-top:6px">Month screen only. The week always has 7 cards.</div></div>'
    +'<div class="row"><span>Snap speed: <b id="durv">'+C.dur+' ms</b></span><input id="dur" type="range" min="150" max="900" step="25" value="'+C.dur+'"><div class="k" style="display:flex;justify-content:space-between"><span>Quick</span><span>Slow</span></div></div>'
    +'<div class="row"><span>Ease (how it slows down at the end)</span>'+seg('ease',[['standard','Standard'],['soft','Soft'],['xsoft','Extra soft']])+'</div>'
    +'<div class="read">Current: <b>'+C.dur+' ms · '+EASE[C.ease][1]+' · '+(C.frame==='fixed'?'Fixed 6 rows':'Adapts to month')+'</b><br><span class="k">The app today uses 220 ms · Standard.</span></div>'
    +'<button class="done" data-a="close">Done</button></div>';
}
document.addEventListener('click',e=>{
  if(swallow)return;
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='prev'){interrupt();animateTo(-1);}
  else if(a==='next'){interrupt();animateTo(1);}
  else if(a==='today'){interrupt();const o=S.off[S.view];if(o)animateTo(o>0?-1:1,0);}
  else if(a==='tab'){if(b.dataset.v==='tune'){S.tune=true;drawTune();drawNav();}else{S.tune=false;drawTune();S.view=b.dataset.v;render();}}
  else if(a==='close'){S.tune=false;drawTune();drawNav();}
  else if(a==='set'){C[b.dataset.k]=b.dataset.v;drawTune();render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='dur'){C.dur=+e.target.value;document.getElementById('durv').textContent=C.dur+' ms';const r=document.querySelector('.read b');if(r)r.textContent=C.dur+' ms · '+EASE[C.ease][1]+' · '+(C.frame==='fixed'?'Fixed 6 rows':'Adapts to month');}
});
window.addEventListener('resize',()=>{if(!S.busy)layout(0);});
render();
setTimeout(()=>{const h=document.getElementById('hint');h.style.opacity='0';setTimeout(()=>h.remove(),500);},3500);
</script>
</body>
</html>
