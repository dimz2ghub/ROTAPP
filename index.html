<!doctype html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotapp</title>
<meta name="theme-color" content="#131416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotapp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Main"></nav>
  <main id="main"><div id="scr"></div></main>
  <aside id="panel" aria-label="Day editor"></aside>
  <div id="ov"></div>
</div>
<input type="file" id="rotaFile" accept=".pdf,.xlsx,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="backupFile" accept=".json,application/json" hidden>
<noscript>Rotapp needs JavaScript to run.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
