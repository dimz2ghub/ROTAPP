<!doctype html>
<html lang="en-GB" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rotapp</title>
<meta name="theme-color" content="#131416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotapp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Main"></nav>
  <div id="stage"><main id="main"><div id="scr"></div></main><div id="pshade" hidden></div><div id="push" hidden></div></div>
  <aside id="panel" aria-label="Day editor"></aside>
  <div id="ov"></div>
  <div id="sh" hidden><div id="shdim"></div><div id="sheet" role="dialog" aria-modal="true"><div id="pages"></div></div><div id="shbar"></div></div>
  <div id="mo" hidden><div id="modim"></div><div id="mwrap"><div id="modal" role="dialog" aria-modal="true"></div></div></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<input type="file" id="rotaFile" accept=".pdf,.xlsx,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="backupFile" accept=".json,application/json" hidden>
<noscript>Rotapp needs JavaScript to run.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
